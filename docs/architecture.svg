<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Gemini tool-using AI agent architecture</title>
  <desc id="desc">A user sends a terminal request to a Gemini chat session. Gemini either answers directly or selects one of three registered tools. Structured observations return to Gemini before the final answer is displayed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .node-title { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-title-light { font: 700 20px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .node-copy { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .node-copy-light { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #eef2ff; }
      .label { font: 700 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .06em; }
      .edge-label { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .edge-return { fill: none; stroke: #4f46e5; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-indigo); }
    </style>
  </defs>

  <rect width="1400" height="820" rx="28" fill="url(#background)"/>
  <text x="70" y="66" class="title">Gemini Tool-Using AI Agent</text>
  <text x="70" y="96" class="subtitle">Request → decision → bounded tool execution → observation → grounded response</text>

  <!-- Primary flow -->
  <rect x="70" y="145" width="235" height="122" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="113" cy="188" r="21" fill="#dbeafe"/>
  <path d="M103 189h20M113 179v20" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="185" class="node-title">User + Terminal</text>
  <text x="96" y="225" class="node-copy">Natural-language request</text>
  <text x="96" y="247" class="node-copy">Interactive session</text>

  <rect x="410" y="135" width="280" height="142" rx="22" fill="url(#gemini)" filter="url(#shadow)"/>
  <text x="445" y="182" class="node-title-light">Gemini Chat Session</text>
  <text x="445" y="214" class="node-copy-light">System instructions</text>
  <text x="445" y="238" class="node-copy-light">Conversation context</text>
  <text x="445" y="262" class="node-copy-light">Registered Python functions</text>

  <path d="M305 206 H400" class="edge"/>
  <text x="330" y="189" class="edge-label">request</text>

  <path d="M790 146 L870 206 L790 266 L710 206 Z" fill="#ffffff" stroke="#818cf8" stroke-width="3" filter="url(#shadow)"/>
  <text x="750" y="199" class="node-title">Tool</text>
  <text x="742" y="224" class="node-title">needed?</text>
  <path d="M690 206 H703" class="edge"/>

  <rect x="1005" y="145" width="300" height="122" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="190" class="node-title">Final Answer</text>
  <text x="1042" y="222" class="node-copy">Concise response displayed</text>
  <text x="1042" y="245" class="node-copy">in the terminal</text>
  <path d="M870 206 H995" class="edge"/>
  <text x="912" y="188" class="edge-label">No</text>

  <!-- Tool boundary -->
  <rect x="190" y="365" width="1020" height="330" rx="28" fill="#ffffff" fill-opacity="0.72" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="225" y="345" width="235" height="42" rx="21" fill="#e2e8f0"/>
  <text x="249" y="372" class="label">BOUNDED TOOL LAYER</text>

  <path d="M790 266 V325 Q790 345 770 345 H700 V410" class="edge"/>
  <text x="807" y="315" class="edge-label">Yes — select function</text>

  <rect x="245" y="425" width="270" height="170" rx="20" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="276" y="470" class="node-title-light">Stock Tool</text>
  <text x="276" y="505" class="node-copy-light">get_stock_price(symbol)</text>
  <text x="276" y="534" class="node-copy-light">Yahoo Finance via yfinance</text>
  <text x="276" y="563" class="node-copy-light">Price + timestamp + source</text>

  <rect x="565" y="425" width="270" height="170" rx="20" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="596" y="470" class="node-title-light">Safe OS Tool</text>
  <text x="596" y="505" class="node-copy-light">run_os_command(name)</text>
  <text x="596" y="534" class="node-copy-light">Fixed allowlist + shell=False</text>
  <text x="596" y="563" class="node-copy-light">10-second execution timeout</text>

  <rect x="885" y="425" width="270" height="170" rx="20" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="916" y="470" class="node-title-light">System Tool</text>
  <text x="916" y="505" class="node-copy-light">get_system_details()</text>
  <text x="916" y="534" class="node-copy-light">Python platform APIs</text>
  <text x="916" y="563" class="node-copy-light">OS + Python + time + path</text>

  <path d="M700 410 V400 H380 V415" class="edge"/>
  <path d="M700 410 V415" class="edge"/>
  <path d="M700 400 H1020 V415" class="edge"/>

  <!-- Observation return -->
  <rect x="455" y="730" width="490" height="58" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="531" y="766" class="node-title">Structured tool observation returns to Gemini</text>
  <path d="M380 595 V675 Q380 710 415 710 H650 V720" class="edge-return"/>
  <path d="M700 595 V720" class="edge-return"/>
  <path d="M1020 595 V675 Q1020 710 985 710 H750 V720" class="edge-return"/>
  <path d="M945 759 H1240 Q1270 759 1270 729 V286 Q1270 276 1260 276 H1155 V277" class="edge-return"/>

  <text x="210" y="657" class="subtitle">Only registered functions cross this boundary; arbitrary shell text is rejected.</text>
</svg>
